<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Libros YM Handy Services</title>
<meta name="theme-color" content="#e8a317">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="YM Libros">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Plan: libro contable de taller — gris acero, amarillo cinta métrica como acento, verde ingreso / rojo gasto.
   Layout: barra superior + pestañas, vista activa en una columna; formulario en hoja deslizante. */
:root{
  --bg:#f2f3f0; --surface:#ffffff; --ink:#1b2229; --muted:#5b656e; --line:#dadeda;
  --accent:#e8a317; --accent-ink:#7a4f00; --on-accent:#1b1606;
  --income:#1d7a4b; --expense:#b23a2e; --warn-bg:#fff4d6; --warn-ink:#6b4a00;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111418; --surface:#1a1f25; --ink:#e8ebee; --muted:#9aa3ab; --line:#2b323a;
    --accent:#f0b429; --accent-ink:#f0b429; --on-accent:#1b1606;
    --income:#4cc38a; --expense:#f0806f; --warn-bg:#3a2f12; --warn-ink:#f5d68a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111418; --surface:#1a1f25; --ink:#e8ebee; --muted:#9aa3ab; --line:#2b323a;
  --accent:#f0b429; --accent-ink:#f0b429; --on-accent:#1b1606;
  --income:#4cc38a; --expense:#f0806f; --warn-bg:#3a2f12; --warn-ink:#f5d68a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-bottom:96px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:22px}
h3{font-size:17px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top-in{max-width:1000px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.brand-row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 16px var(--display)}
.brand h1{font-size:21px;line-height:1.1}
.brand .sub{font-size:12px;color:var(--muted)}
.year{display:flex;align-items:center;gap:6px}
.year select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:8px 12px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main{max-width:1000px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.banner{border-radius:8px;padding:10px 14px;background:var(--warn-bg);color:var(--warn-ink);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.tile .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.tile .val{font:700 28px/1.15 var(--display);margin-top:4px}
.tile .hint{font-size:12px;color:var(--muted);margin-top:2px}
.inc{color:var(--income)} .exp{color:var(--expense)}
.row-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}

.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 4px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;border-radius:0}
.item:hover{background:var(--bg)}
.item:first-child{border-top:0}
.thumb{width:44px;height:44px;border-radius:6px;background:var(--bg);border:1px solid var(--line);object-fit:cover;display:grid;place-items:center;font-size:11px;color:var(--muted);overflow:hidden}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .m{font-size:13px;color:var(--muted)}
.item .amt{font-weight:600;text-align:right}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:1px}
.chip.review{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent}
.chip.half{color:var(--accent-ink);border-color:var(--accent)}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters input,.filters select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0}
.filters input{flex:1 1 180px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-top:0}
td.r,th.r{text-align:right}
tfoot td{font-weight:700;border-top:2px solid var(--ink)}
.scroll-x{overflow-x:auto}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--expense)}
.btn:disabled{opacity:.55;cursor:default}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.dock-in{max-width:1000px;margin:0 auto;display:flex;gap:8px}
.dock .btn{flex:1;padding:12px;font-size:15px}

.grid-r{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.rc{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);text-align:left;padding:0}
.rc img{width:100%;height:150px;object-fit:cover;display:block;background:var(--bg)}
.rc .pdf{height:150px;display:grid;place-items:center;background:var(--bg);color:var(--muted);font-weight:600}
.rc .cap{padding:8px;font-size:13px}

/* hoja de formulario */
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,14,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:14px}}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:420px){.form{grid-template-columns:1fr}}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.f textarea{min-height:60px;resize:vertical}
.preview{display:flex;gap:12px;align-items:flex-start}
.preview img{max-width:130px;max-height:170px;border-radius:7px;border:1px solid var(--line);object-fit:contain;background:var(--bg)}
.status{font-size:13px;padding:8px 10px;border-radius:7px;background:var(--bg)}
.status.err{color:var(--expense)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:8px;z-index:30;font-size:14px;max-width:90%}
.viewer img{max-width:100%;border-radius:8px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.empty{padding:22px 8px;text-align:center;color:var(--muted)}
.note{font-size:13px;color:var(--muted);max-width:70ch}
ul.notes{margin:8px 0 0;padding-left:18px;font-size:14px;max-width:72ch}
ul.notes li{margin:4px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand-row">
      <div class="brand">
        <div class="mark" aria-hidden="true">YM</div>
        <div><h1>YM Handy Services</h1><div class="sub">Libros del negocio · Katy, TX</div></div>
      </div>
      <div class="year"><label for="yearSel" class="small muted">Año fiscal</label><select id="yearSel"></select></div>
    </div>
    <nav class="tabs" aria-label="Secciones">
      <button data-tab="resumen">Resumen</button>
      <button data-tab="movimientos">Movimientos</button>
      <button data-tab="recibos">Recibos</button>
      <button data-tab="millas">Millas</button>
      <button data-tab="taxes">Reporte de taxes</button>
    </nav>
  </div>
</header>
<main id="view"></main>
<div class="dock"><div class="dock-in">
  <button class="btn primary" id="scanBtn">📷 Escanear recibo</button>
  <button class="btn" id="incBtn">+ Ingreso</button>
  <button class="btn" id="expBtn">+ Gasto</button>
</div></div>
<input type="file" id="scanInput" accept="image/*,application/pdf" multiple hidden>
<div id="sheetHost"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
"use strict";
/* ---------- Catálogos ---------- */
const EXP_CATS = [
  {k:"materiales",n:"Materiales para trabajos",line:"22 · Suministros / materiales",ded:1},
  {k:"herramientas",n:"Herramientas y equipo",line:"22 o 13 · Herramientas (ver nota)",ded:1},
  {k:"gasolina",n:"Gasolina",line:"9 · Vehículo",ded:1,veh:true},
  {k:"vehiculo",n:"Mantenimiento y reparación de vehículo",line:"9 · Vehículo",ded:1,veh:true},
  {k:"peajes",n:"Peajes y estacionamiento",line:"9 · Vehículo",ded:1},
  {k:"comidas",n:"Comidas de negocio",line:"24b · Comidas (50%)",ded:0.5},
  {k:"subcontratistas",n:"Subcontratistas / ayudantes",line:"11 · Mano de obra contratada",ded:1},
  {k:"renta_equipo",n:"Renta de equipo",line:"20a · Renta de equipo",ded:1},
  {k:"reparaciones",n:"Reparación de herramientas",line:"21 · Reparaciones",ded:1},
  {k:"seguro",n:"Seguro del negocio",line:"15 · Seguro",ded:1},
  {k:"publicidad",n:"Publicidad y marketing",line:"8 · Publicidad",ded:1},
  {k:"telefono",n:"Teléfono e internet",line:"25 · Servicios",ded:1},
  {k:"oficina",n:"Oficina y software",line:"18 · Gastos de oficina",ded:1},
  {k:"profesionales",n:"Contador y servicios legales",line:"17 · Servicios profesionales",ded:1},
  {k:"licencias",n:"Licencias, permisos e impuestos",line:"23 · Impuestos y licencias",ded:1},
  {k:"ropa",n:"Ropa de trabajo y equipo de seguridad",line:"27a · Otros gastos",ded:1},
  {k:"comisiones",n:"Comisiones bancarias y de pago",line:"27a · Otros gastos",ded:1},
  {k:"otros",n:"Otros gastos del negocio",line:"27a · Otros gastos",ded:1},
  {k:"personal",n:"Personal (no deducible)",line:"No va en el Schedule C",ded:0},
];
const INC_CATS = [
  {k:"servicio",n:"Trabajo / mano de obra"},
  {k:"materiales_cobrados",n:"Materiales cobrados al cliente"},
  {k:"otro_ingreso",n:"Otros ingresos"},
];
const PAY = ["Efectivo","Tarjeta de débito","Tarjeta de crédito","Zelle","Cheque","Cash App","Venmo","PayPal","Transferencia","Otro"];
const MONTHS = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const RATES = {2025:[["01-01",0.70]],2026:[["01-01",0.725],["07-01",0.76]]};
const DUE = {2026:["15 abr 2026","15 jun 2026","15 sep 2026","15 ene 2027"],2027:["15 abr 2027","15 jun 2027","15 sep 2027","18 ene 2028"]};
const catOf = (type,k)=> (type==="income"?INC_CATS:EXP_CATS).find(c=>c.k===k) || {k,n:k||"Sin categoría",line:"27a · Otros gastos",ded:1};

/* ---------- Estado ---------- */
const state = {
  db:null, assets:null, sample:null, dl:null, canImg:false,
  tx:new Map(), settings:{vehicleMethod:"standard",reservePct:25,customRate:0.76,businessUsePct:100},
  year:new Date().getFullYear(), tab:"resumen", loaded:false, stale:false, noDb:false,
  filter:{type:"all",cat:"all",q:"",month:"all",review:false}
};
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"});
const money = n=>fmt.format(Number(n)||0);
const short = n=>{n=Number(n)||0;return Math.abs(n)>=1000?"$"+(n/1000).toFixed(n>=10000?0:1)+"k":"$"+Math.round(n);};
const today = ()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const fdate = s=>{if(!s)return "";const [y,m,d]=s.split("-");return `${+d} ${MONTHS[+m-1]||""} ${y}`;};
const BLOBURL = new Map();
const blobUrl = id=>BLOBURL.get(id)||"";
function toast(msg,ms=2600){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms);}

function rateFor(date){
  const y=+date.slice(0,4), md=date.slice(5);
  const tbl=RATES[y]; if(!tbl) return Number(state.settings.customRate)||0;
  let r=tbl[0][1]; for(const [from,v] of tbl){ if(md>=from) r=v; } return r;
}
function dedFactor(tx){
  if(tx.type!=="expense") return 0;
  const c=catOf("expense",tx.category);
  if(c.veh){ return state.settings.vehicleMethod==="standard"?0:(Number(state.settings.businessUsePct)||0)/100; }
  return c.ded;
}
function yearTx(){ const y=String(state.year); return [...state.tx.entries()].map(([id,d])=>({id,...d})).filter(t=>(t.date||"").startsWith(y)).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0)); }

function totals(list){
  const t={income:0,expense:0,deductible:0,miles:0,mileageDed:0,byCat:{},byIncCat:{},byMonth:Array.from({length:12},()=>({i:0,e:0})),noReceipt:0,review:0};
  for(const x of list){
    const amt=Number(x.amount)||0, m=(+x.date.slice(5,7))-1;
    if(x.review) t.review++;
    if(x.type==="income"){ t.income+=amt; t.byIncCat[x.category]=(t.byIncCat[x.category]||0)+amt; if(m>=0)t.byMonth[m].i+=amt; }
    else if(x.type==="expense"){
      t.expense+=amt; const f=dedFactor(x); t.deductible+=amt*f;
      const b=t.byCat[x.category]||(t.byCat[x.category]={amt:0,ded:0,n:0}); b.amt+=amt; b.ded+=amt*f; b.n++;
      if(m>=0 && x.category!=="personal") t.byMonth[m].e+=amt;
      if(!x.receiptId && x.category!=="personal") t.noReceipt++;
    } else if(x.type==="miles"){ const mi=Number(x.miles)||0; t.miles+=mi; t.mileageDed+=mi*rateFor(x.date); }
  }
  if(state.settings.vehicleMethod!=="standard") t.mileageDed=0;
  t.totalDed=t.deductible+t.mileageDed;
  t.net=t.income-t.totalDed;
  t.seTax=Math.max(0,t.net)*0.9235*0.153;
  t.reserve=Math.max(0,t.net)*(Number(state.settings.reservePct)||0)/100;
  return t;
}

/* ---------- Render ---------- */
function setTab(tab){ state.tab=tab; if(location.hash!=="#"+tab){ try{history.replaceState(null,"","#"+tab);}catch(e){location.hash=tab;} } render(); }
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===state.tab?"page":"false"));
  renderYears();
  const v=$("#view"); const list=yearTx(); const t=totals(list);
  let html=banners();
  if(state.tab==="movimientos") html+=viewMov(list);
  else if(state.tab==="recibos") html+=viewRec(list);
  else if(state.tab==="millas") html+=viewMiles(list,t);
  else if(state.tab==="taxes") html+=viewTaxes(list,t);
  else html+=viewResumen(list,t);
  v.innerHTML=html;
  const q=$("#fq"); if(q && state._focusQ){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); state._focusQ=false; }
}
function banners(){
  if(state.noDb) return `<div class="banner">Este navegador no deja guardar datos (puede ser el modo privado). Ábrela en Safari o Chrome normal.</div>`;
  if(!state.loaded) return `<div class="banner">Cargando tus libros…</div>`;
  const lb=+(state.settings.lastBackup||0), n=state.tx.size;
  if(n>=10 && Date.now()-lb>30*864e5) return `<div class="banner">Tus datos viven solo en este teléfono. ${lb?"Tu último respaldo fue hace más de un mes.":"Todavía no has hecho un respaldo."} <button class="btn" style="margin-left:8px;padding:4px 10px" data-act="backup">Hacer respaldo</button></div>`;
  return "";
}
function renderYears(){
  const sel=$("#yearSel"); const ys=new Set([new Date().getFullYear(),new Date().getFullYear()+1,state.year]);
  for(const d of state.tx.values()) if(d.date) ys.add(+d.date.slice(0,4));
  const arr=[...ys].sort((a,b)=>b-a); const cur=arr.join(",");
  if(sel.dataset.k!==cur){ sel.innerHTML=arr.map(y=>`<option value="${y}">${y}</option>`).join(""); sel.dataset.k=cur; }
  sel.value=String(state.year);
}

function itemRow(x){
  const isInc=x.type==="income", isMi=x.type==="miles";
  const c=catOf(x.type,x.category);
  const th = x.receiptId ? (x.receiptType==="application/pdf"?`<div class="thumb">PDF</div>`:`<img class="thumb" alt="" loading="lazy" src="${blobUrl(x.receiptId)}">`) : `<div class="thumb">${isMi?"mi":"—"}</div>`;
  const title = isMi ? `${esc(x.miles)} millas` : esc(x.vendor||c.n);
  const meta = isMi ? `${fdate(x.date)} · ${esc(x.purpose||"Viaje de trabajo")}` : `${fdate(x.date)} · ${esc(c.n)}${x.payment?" · "+esc(x.payment):""}`;
  const chips = (x.review?`<span class="chip review">Por revisar</span>`:"") + (!isInc&&!isMi&&catOf("expense",x.category).ded===0.5?`<span class="chip half">50%</span>`:"");
  const amt = isMi ? `<span class="muted">${money((+x.miles||0)*rateFor(x.date))}</span>` : `<span class="${isInc?"inc":"exp"}">${isInc?"+":"−"}${money(x.amount)}</span>`;
  return `<button class="item" data-act="edit" data-id="${esc(x.id)}">${th}<div><div class="t">${title}${chips}</div><div class="m">${meta}</div></div><div class="amt num">${amt}</div></button>`;
}

function viewResumen(list,t){
  const recent=list.filter(x=>x.type!=="miles").slice(0,8);
  const rev=list.filter(x=>x.review).length;
  return `
  <section class="tiles" aria-label="Totales del año">
    <div class="tile"><div class="lbl">Ingresos ${state.year}</div><div class="val inc num">${money(t.income)}</div><div class="hint">Línea 1 · ingresos brutos</div></div>
    <div class="tile"><div class="lbl">Gastos deducibles</div><div class="val exp num">${money(t.totalDed)}</div><div class="hint">${state.settings.vehicleMethod==="standard"?"Incluye "+money(t.mileageDed)+" de millaje":"Gastos reales de vehículo"}</div></div>
    <div class="tile"><div class="lbl">Ganancia neta</div><div class="val num">${money(t.net)}</div><div class="hint">Línea 31 · estimado</div></div>
    <div class="tile"><div class="lbl">Apartar para taxes</div><div class="val num" style="color:var(--accent-ink)">${money(t.reserve)}</div><div class="hint">${state.settings.reservePct}% de la ganancia · self-employment ≈ ${money(t.seTax)}</div></div>
  </section>

function chartSvg(byMonth){
  const W=640,H=230,pl=44,pr=8,pt=10,pb=26; const iw=W-pl-pr, ih=H-pt-pb;
  let max=Math.max(1,...byMonth.map(m=>Math.max(m.i,m.e)));
  const step=Math.pow(10,Math.floor(Math.log10(max))); max=Math.ceil(max/step)*step; if(max/step<4) max=Math.ceil(max/(step/2))*(step/2);
  const gw=iw/12, bw=Math.min(16,gw*0.32);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos por mes">`;
  for(let k=0;k<=4;k++){const v=max*k/4,y=pt+ih-ih*k/4; s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${short(v)}</text>`;}
  byMonth.forEach((m,i)=>{
    const x=pl+gw*i+gw/2; const hi=ih*m.i/max, he=ih*m.e/max;
    if(m.i>0) s+=`<rect x="${x-bw-1}" y="${pt+ih-hi}" width="${bw}" height="${hi}" rx="2" fill="var(--income)"><title>${MONTHS[i]}: ingresos ${money(m.i)}</title></rect>`;
    if(m.e>0) s+=`<rect x="${x+1}" y="${pt+ih-he}" width="${bw}" height="${he}" rx="2" fill="var(--expense)"><title>${MONTHS[i]}: gastos ${money(m.e)}</title></rect>`;
    s+=`<text x="${x}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${MONTHS[i]}</text>`;
  });
  return s+`</svg>`;
}

function renderPreview(){
  const pv=$("#pv"); if(!pv||!form) return;

  const canRead = state.sample && state.canImg && (form.file?.type?.startsWith("image/"));
  pv.innerHTML = img ? `${img}<div class="small muted" style="display:flex;flex-direction:column;gap:8px">${form.file?"Foto lista; se guarda al tocar Guardar.":"Recibo guardado."}${canRead?`<button class="btn" type="button" data-act="ocr">Leer recibo otra vez</button>`:""}</div>` : "";
}
async function attachFile(file, autoRead){
  const small = await compress(file);
  form.file = small;
  if(form.preview) URL.revokeObjectURL(form.preview);
  form.preview = small.type.startsWith("image/") ? URL.createObjectURL(small) : null;
  renderPreview();
  if(autoRead){
    if(state.sample && state.canImg && small.type.startsWith("image/")) runOCR();
    else if(small.type==="application/pdf") setStatus("El PDF se guarda como respaldo; llena los datos a mano.");
    else if(!state.sample || !state.canImg) setStatus("No se pudo leer la foto automáticamente; llena los datos a mano.");
  }
}
function setStatus(msg,err){ const s=$("#ocrStatus"); if(s) s.innerHTML = msg?`<div class="status ${err?"err":""}" style="margin-bottom:12px">${esc(msg)}</div>`:""; }
async function compress(file){
  if(!file.type || !file.type.startsWith("image/")) return file;
  try{
    const bmp = await createImageBitmap(file,{imageOrientation:"from-image"});
    const max=1800, sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height); bmp.close&&bmp.close();
    const b = await new Promise(r=>c.toBlob(x=>r(x),"image/jpeg",0.82));
    return b||file;
  }catch(e){ return file; }
}
async function readImage(blob,type,onProg){
  const text = await ocrText(blob,onProg);
  return parseReceipt(text,type);
}
let _worker=null;
async function ocrText(blob,onProg){
  if(!window.Tesseract) throw {code:"nolib"};
  if(!_worker){
    _worker = await Tesseract.createWorker("eng",1,{logger:m=>{ if(m.status==="recognizing text" && _prog) _prog(m.progress); }});
  }
  _prog=onProg||null;
  const {data} = await _worker.recognize(blob);
  _prog=null;
  return data.text||"";
}

function parseReceipt(text,type){
  const lines=text.split(/\n/).map(l=>l.trim()).filter(Boolean);
  const amt=l=>{const m=[...l.replace(/,/g,"").matchAll(/\$?\s?(\d{1,6}\.\d{2})\b/g)].map(x=>+x[1]);return m;};
  let total=null, tax=null;
  for(let i=lines.length-1;i>=0;i--){ const l=lines[i];
    if(/total/i.test(l) && !/sub\s*-?total|total\s*(savings|saved|items|qty|discount)/i.test(l)){ const a=amt(l).concat(amt(lines[i+1]||"")); if(a.length){ total=a[0]; break; } } }
  if(total==null){ for(const l of lines){ if(/amount|balance|due|charged|visa|mastercard|debit|cash/i.test(l)){ const a=amt(l); if(a.length){ total=Math.max(total||0,...a); } } } }
  if(total==null){ const all=lines.flatMap(amt); if(all.length) total=Math.max(...all); }
  for(const l of lines){ if(/\btax\b/i.test(l) && !/total/i.test(l)){ const a=amt(l); if(a.length){ tax=a[a.length-1]; break; } } }
  let date=null;
  for(const l of lines){ let m=l.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/);
    if(m){ let [_,mo,d,y]=m; y=y.length===2?"20"+y:y; mo=+mo; d=+d; if(mo>=1&&mo<=12&&d>=1&&d<=31&&+y>=2020&&+y<=2035){ date=`${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`; break; } }
    m=l.match(/\b(\d{4})-(\d{2})-(\d{2})\b/); if(m){ date=m[0]; break; } }
  let vendor=null, category=type==="income"?"servicio":"otros";
  const joined=lines.slice(0,12).join(" ")+" "+text;
  if(type==="expense"){ for(const [re,name,cat] of STORES){ if(re.test(joined)){ vendor=name; category=cat; break; } } }
  if(!vendor){ vendor=(lines.find(l=>/[a-z]{3,}/i.test(l) && !/receipt|welcome|thank|store\s*#|^\d/i.test(l))||"").replace(/[^\w&'.\- ]/g,"").slice(0,40)||null; }
  if(category==="gasolina" && !/gal|fuel|unleaded|diesel|pump|regular|premium/i.test(text)) category="comidas";
  let payment=null;
  if(/debit/i.test(text)) payment="Tarjeta de débito"; else if(/visa|mastercard|amex|discover|credit/i.test(text)) payment="Tarjeta de crédito"; else if(/\bcash\b|change\s*due/i.test(text)) payment="Efectivo";
  if(type==="income"){ if(/zelle/i.test(text)) payment="Zelle"; else if(/cash\s*app|\$cashtag/i.test(text)) payment="Cash App"; else if(/venmo/i.test(text)) payment="Venmo"; else if(/pay\s*to\s*the\s*order|check/i.test(text)) payment="Cheque"; }
  const items=lines.filter(l=>amt(l).length && !/total|tax|change|debit|credit|visa|master|cash|balance|amount|due|savings|card|auth/i.test(l)).map(l=>l.replace(/\$?\s?\d{1,6}\.\d{2}.*$/,"").replace(/^[\d\s@xX]+(?=[A-Za-z])/,"").trim()).filter(l=>/[a-z]{3,}/i.test(l)).slice(0,4);
  const description = items.length? items.map(t=>t.charAt(0)+t.slice(1).toLowerCase()).join(", ").slice(0,120) : "";
  const conf = (total!=null && date && vendor)?"alta":(total!=null?"media":"baja");
  return {vendor,date,total,tax,payment,category,description,confidence:conf};
}
async function runOCR(){
  if(!form?.file || form.busy) return;
  const type=form.type; form.busy=true;
  setStatus("Leyendo el recibo… la primera vez tarda más porque descarga el lector.");
  try{
    const r = await readImage(form.file,type,p=>setStatus("Leyendo el recibo… "+Math.round(p*100)+"%"));
    if(!form || form.type!==type) return;
    if(r.date && /^\d{4}-\d{2}-\d{2}$/.test(r.date)) $("#fDate").value=r.date;
    if(r.total!=null && !isNaN(+r.total)) $("#fAmt").value=(+r.total).toFixed(2);
    if(r.vendor) $("#fVendor").value=String(r.vendor).slice(0,80);
    const cats=(type==="income"?INC_CATS:EXP_CATS).map(c=>c.k); if(cats.includes(r.category)) $("#fCat").value=r.category;
    if(PAY.includes(r.payment)) $("#fPay").value=r.payment;
    if(r.description) $("#fDesc").value=String(r.description).slice(0,200);
    if(type==="expense" && r.tax!=null && !isNaN(+r.tax) && $("#fTax")) $("#fTax").value=(+r.tax).toFixed(2);
    setStatus(r.confidence==="alta"?"Listo. Revisa los datos y toca Guardar.":"Leí lo que pude; revisa y completa los datos antes de guardar.");
    checkDup();
  }catch(e){ setStatus(e?.code==="nolib"?"El lector de recibos necesita internet la primera vez. Conéctate y toca Leer recibo otra vez, o llena los datos a mano.":"No pude leer el recibo. Llena los datos a mano.",true); }
  finally{ if(form) form.busy=false; }
}

/* ---------- Almacenamiento local (IndexedDB) ---------- */
const LS = (()=>{
  let dbp=null;
  const open=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open("ym-libros",1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("tx");d.createObjectStore("blobs");d.createObjectStore("meta");};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
  const run=async(store,mode,fn)=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction(store,mode);const st=t.objectStore(store);let out;const q=fn(st);if(q)q.onsuccess=()=>{out=q.result;};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});};
  return {
    open,
    all:async()=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction("tx");const st=t.objectStore("tx");const out=new Map();const c=st.openCursor();c.onsuccess=()=>{const k=c.result;if(k){out.set(String(k.key),k.value);k.continue();}};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);});},
    put:(id,v)=>run("tx","readwrite",s=>s.put(v,id)),
    del:id=>run("tx","readwrite",s=>s.delete(id)),
    getMeta:k=>run("meta","readonly",s=>s.get(k)),
    putMeta:(k,v)=>run("meta","readwrite",s=>s.put(v,k)),
    putBlob:(id,b)=>run("blobs","readwrite",s=>s.put(b,id)),
    getBlob:id=>run("blobs","readonly",s=>s.get(id)),
    delBlob:id=>run("blobs","readwrite",s=>s.delete(id)),
    blobKeys:()=>run("blobs","readonly",s=>s.getAllKeys()),
  };
})();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
/* Adaptadores con la misma forma que usa el resto del código */
const localDb = {
  collection(c){ return { doc:(id)=>localDb.doc(c+"/"+(id||uid())) }; },
  doc(path){
    const [c,id]=path.split("/");
    return {
      id,
      set: async obj=>{ if(c==="config"){ await LS.putMeta(id,obj); state.settings={...state.settings,...obj}; } else { await LS.put(id,obj); state.tx.set(id,obj); } render(); },
      delete: async()=>{ await LS.del(id); state.tx.delete(id); render(); },
    };
  }
};
const localAssets = {
  upload: async blob=>{ const id="r"+uid(); await LS.putBlob(id,blob); BLOBURL.set(id,URL.createObjectURL(blob)); return {id,contentType:blob.type}; },
  delete: async id=>{ await LS.delBlob(id); const u=BLOBURL.get(id); if(u) URL.revokeObjectURL(u); BLOBURL.delete(id); },
};
(async()=>{
  state.sample={local:true}; state.canImg=true;
  try{
    await LS.open();
    state.tx = await LS.all();
    const st = await LS.getMeta("settings"); if(st) state.settings={...state.settings,...st};
    const keys = await LS.blobKeys();
    for(const k of keys){ const b=await LS.getBlob(k); if(b) BLOBURL.set(String(k),URL.createObjectURL(b)); }
    state.db=localDb; state.assets=localAssets; state.loaded=true;
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  }catch(e){ state.noDb=true; state.loaded=true; }
  render();
})();
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
